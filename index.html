<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meine Apps</title>
  <meta name="theme-color" content="#0A0C11">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100dvh; background: #0A0C11; color: #F2F4F8; font-family: Inter, system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: calc(28px + env(safe-area-inset-top)) 16px 32px; }
    h1 { font-size: 30px; font-weight: 900; letter-spacing: -.03em; margin: 0 0 4px; }
    p { color: #8C94A6; margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    a.app, div.app { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 18px; background: #161A23; border: 1px solid rgba(255,255,255,.05); color: inherit; text-decoration: none; transition: transform .1s; }
    a.app:active { transform: scale(.97); }
    .app img, .app .ph { width: 52px; height: 52px; border-radius: 14px; }
    .app .ph { background: #1D222D; display: grid; place-items: center; font-size: 24px; }
    .app b { font-size: 16px; }
    .app span { font-size: 13px; color: #8C94A6; }
    div.app { opacity: .45; }
  </style>
</head>
<body>
  <main>
    <h1>Meine Apps</h1>
    <p>Ein Konto, alle Daten verknüpft.</p>
    <div class="grid">
      <a class="app" href="gym/"><img src="gym/icon-192.png" alt=""><div><b>Gym</b><br><span>Training, Ränge, Fortschritt</span></div></a>
      <div class="app"><div class="ph">📅</div><div><b>Kalender</b><br><span>Kommt bald</span></div></div>
      <a class="app" href="kalorien/"><img src="kalorien/icon-192.png" alt=""><div><b>Kalorien</b><br><span>Essen, Makros, Barcode</span></div></a>
    </div>
  </main>
</body>
</html>
